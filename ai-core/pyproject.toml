[project]
name = "wemeet-ai-core"
version = "0.10.1"
description = "Database-independent M0/M1 goal coaching and planning modules"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pydantic>=2.7,<3", "tzdata>=2025.2; platform_system == 'Windows'"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]
test = ["pytest>=8.3,<9", "httpx>=0.28,<1"]

[project.scripts]
wemeet-ai = "wemeet_ai.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"wemeet_ai.adapters" = ["*.html", "*.js", "*.css"]
"wemeet_ai" = ["data/*.jsonl"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
