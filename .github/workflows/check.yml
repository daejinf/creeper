name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wemeet
          POSTGRES_PASSWORD: wemeet
          POSTGRES_DB: wemeet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wemeet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - run: pip install -r backend/requirements-lock.txt
      - run: pip install --no-deps -e backend
      - run: pytest
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://wemeet:wemeet@localhost:5432/wemeet

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
