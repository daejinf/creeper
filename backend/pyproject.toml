[project]
name = "wemeet-ai"
version = "0.1.0"
description = "WE-MEET AI planning and evaluation service"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "anyio>=4.4,<4.10",
  "apscheduler>=3.10,<4",
  "fastapi>=0.115,<0.116",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "starlette>=0.40,<0.47",
  "uvicorn[standard]>=0.34,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

